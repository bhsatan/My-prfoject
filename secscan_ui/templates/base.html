<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SecScan UI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header>
    <div class="nav-wrap">
      <a class="brand" href="{{ url_for('home') }}">SecScan UI</a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('home') }}">Overview</a>
        <a href="{{ url_for('scans_list') }}">Scans &amp; Trends</a>
        <a href="{{ url_for('dashboards_view') }}">Dashboards</a>
        <a href="{{ url_for('ai_assistant') }}">AI Assistant</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div class="banner" role="note">
      Read-only viewer: SecScan UI displays local scan reports offline and never modifies your host.
    </div>
    {% block content %}{% endblock %}
  </main>

  <footer>
    SecScan v{{ tool_version }} · Local-first offline viewer
  </footer>
</body>
</html>
