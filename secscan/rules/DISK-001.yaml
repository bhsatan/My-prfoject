id: "DISK-001"
title: "OS drive is encrypted"
severity: "high"
applies_to:
  - "windows"
  - "linux"
collector: "disk_encryption"
fact_path: "disk_encryption.os_drive_encrypted"
condition:
  operator: "equals"
  expected: true
why_it_matters: >
  Disk encryption protects your files if your computer is lost or stolen.
  Without it, anyone who has physical access to your hard drive can read
  all your data, including passwords saved in browsers and personal documents.
how_to_fix:
  windows:
    - "Open the Start menu and type 'BitLocker', then click 'Manage BitLocker'."
    - "Next to your C: drive, click 'Turn on BitLocker'."
    - "Follow the wizard to choose how to unlock your drive and where to save your recovery key."
    - "Note: BitLocker requires Windows Pro, Enterprise, or Education. Windows Home users can use 'Device Encryption' in Settings > Privacy & security > Device encryption if the hardware supports it."
  linux:
    - 'Check the current layout with: lsblk -f   (look for crypto_LUKS above your root filesystem)'
    - 'To encrypt an existing system, back up your data, then reinstall with full-disk (LUKS) encryption selected.'
    - 'In a virtual machine, encrypting the host drive may be enough.'
difficulty: "hard"
source:
  windows: "Microsoft – BitLocker overview: https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/"
  linux: "cryptsetup (LUKS) project: https://gitlab.com/cryptsetup/cryptsetup"
