id: "SSH-001"
title: "SSH root login is fully disabled"
severity: "critical"
applies_to:
  - "linux"
collector: "ssh"
fact_path: "ssh.permit_root_login"
condition:
  operator: "equals"
  expected: "no"
why_it_matters: >
  Allowing root login over SSH means an attacker who guesses or steals the
  root password (or key) gets full control of your system in one step.
  Disabling root login forces users to log in with a regular account first,
  then use 'sudo' for admin tasks — adding a layer of protection and an
  audit trail.
how_to_fix:
  linux:
    - 'If you do not need to SSH into this machine, disable the server: on Ubuntu 22.10+ run sudo systemctl disable --now ssh.socket ssh   (on older Debian/Ubuntu: sudo systemctl disable --now ssh; on Fedora/RHEL: sudo systemctl disable --now sshd)'
    - 'Make sure another account with sudo access can log in.'
    - 'Confirm /etc/ssh/sshd_config has an active global "Include /etc/ssh/sshd_config.d/*.conf" line before any conflicting PermitRootLogin setting, then create /etc/ssh/sshd_config.d/00-hardening.conf containing: PermitRootLogin no   (or set PermitRootLogin no directly at the top of /etc/ssh/sshd_config if Include is not supported).'
    - 'Check the syntax: sudo sshd -t'
    - 'Apply it: sudo systemctl restart ssh   (sshd on Fedora/RHEL)'
    - 'Confirm the effective settings for root and any remote Match contexts: sudo sshd -T -C user=root   (and test relevant -C user=...,addr=... combinations if you use Match blocks; resolve any conflicting Match overrides).'
difficulty: "easy"
source: >
  OpenSSH sshd_config manual – PermitRootLogin:
  https://man.openbsd.org/sshd_config
