id: "SSH-002"
title: "SSH password authentication is disabled"
severity: "medium"
applies_to:
  - "linux"
collector: "ssh"
fact_path: "ssh.password_auth_enabled"
condition:
  operator: "equals"
  expected: false
why_it_matters: >
  Password-based SSH login is vulnerable to brute-force attacks where
  automated tools try thousands of passwords per minute. Using SSH keys
  instead is far more secure — a key is virtually impossible to guess.
  Disabling password authentication forces everyone to use keys.
how_to_fix:
  linux:
    - 'If you do not need to SSH into this machine, disable the server: on Ubuntu 22.10+ run sudo systemctl disable --now ssh.socket ssh   (on older Debian/Ubuntu: sudo systemctl disable --now ssh; on Fedora/RHEL: sudo systemctl disable --now sshd)'
    - 'Set up SSH key login and confirm it works first, or you will be locked out.'
    - 'Confirm /etc/ssh/sshd_config has an active global "Include /etc/ssh/sshd_config.d/*.conf" line before any conflicting PasswordAuthentication setting, then create /etc/ssh/sshd_config.d/01-password-auth.conf (or append to 00-hardening.conf without removing existing lines) containing: PasswordAuthentication no and, on its own line, KbdInteractiveAuthentication no   (fallback: set both directly at the top of /etc/ssh/sshd_config).'
    - 'Check the syntax: sudo sshd -t'
    - 'Apply it: sudo systemctl restart ssh   (sshd on Fedora/RHEL)'
    - 'Confirm the effective settings for your login user and any Match contexts: sudo sshd -T -C user=YOUR_USERNAME   (and test relevant -C user=...,addr=... combinations if you use Match blocks; resolve any conflicting Match overrides).'
difficulty: "medium"
source: >
  OpenSSH sshd_config manual – PasswordAuthentication:
  https://man.openbsd.org/sshd_config
