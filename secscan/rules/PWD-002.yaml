id: "PWD-002"
title: "Account lockout is configured"
severity: "medium"
applies_to:
  - "windows"
  - "linux"
collector: "password_policy"
fact_path: "password_policy.lockout_threshold"
condition:
  operator: "greater_than"
  expected: 0
why_it_matters: >
  Without an account lockout policy, an attacker can try unlimited password
  guesses against your accounts. Setting a lockout threshold (for example,
  lock after 5 failed attempts) slows down brute-force attacks dramatically.
how_to_fix:
  windows:
    - "Press Win+R, type 'secpol.msc', and press Enter (requires admin)."
    - "Go to Account Policies > Account Lockout Policy."
    - "Double-click 'Account lockout threshold' and set it to 5 (or your preferred limit)."
    - "Windows will suggest values for lockout duration and reset counter — accept the defaults or adjust as needed."
  linux:
    - 'WARNING: a mistake in PAM files can block all logins. Open a root shell (sudo -i), keep it open, and back up the files you edit.'
    - 'Fedora/RHEL: sudo authselect enable-feature with-faillock'
    - 'Debian/Ubuntu/Kali: in /etc/pam.d/common-auth add before pam_unix: auth required pam_faillock.so preauth'
    - 'Add directly after pam_unix: auth [default=die] pam_faillock.so authfail'
    - 'Adding that line changes how many modules a successful login must skip: raise N by 1 in the pam_unix [success=N ...] option (usually 1 becomes 2). If you skip this, correct passwords are rejected.'
    - 'In /etc/pam.d/common-account add: account required pam_faillock.so'
    - 'In /etc/security/faillock.conf set: deny = 5 and unlock_time = 900'
    - 'Test a login in a second terminal before closing the root shell.'
difficulty: "easy"
source:
  windows: "Microsoft – Account Lockout Threshold: https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/account-lockout-threshold"
  linux: "pam_faillock manual: https://man7.org/linux/man-pages/man8/pam_faillock.8.html"
