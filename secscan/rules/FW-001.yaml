id: "FW-001"
title: "Firewall is enabled on all network profiles"
severity: "critical"
applies_to:
  - "windows"
  - "linux"
collector: "firewall"
fact_path: "firewall.all_profiles_enabled"
condition:
  operator: "equals"
  expected: true
why_it_matters: >
  A firewall blocks unwanted incoming connections to your computer.
  Without it, programs on your network or the internet can try to
  reach services on your machine that should be private.
how_to_fix:
  windows:
    - "Open the Start menu and type 'Windows Security', then press Enter."
    - "Click 'Firewall & network protection'."
    - "For each network (Domain, Private, and Public), click it and make sure the firewall is turned ON."
  linux:
    - 'Check which firewall you have. On Debian, Ubuntu or Kali you can install ufw: sudo apt install ufw'
    - 'If you connect over SSH, first find your active SSH listening port: sudo ss -tlnp | grep ssh   (or sudo sshd -T | grep "^port ")'
    - 'Allow that exact TCP port before enabling ufw (e.g. for port 22: sudo ufw allow 22/tcp), and make sure you have console/recovery access in case of a mistake.'
    - 'Enable ufw: sudo ufw enable   then test logging in from a second SSH connection before closing your current session, and verify: sudo ufw status verbose'
    - 'If you use firewalld instead: sudo systemctl enable --now firewalld   then verify: sudo firewall-cmd --state'
difficulty: "easy"
source:
  windows: "Microsoft – Windows Defender Firewall overview: https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/"
  linux: "Ubuntu Server documentation – Firewall: https://documentation.ubuntu.com/server/how-to/security/firewalls/"
