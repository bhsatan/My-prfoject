name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          pip install -e ".[dev]"
          pytest -v --tb=short

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum secscan-*.whl secscan-*.tar.gz > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      - name: Extract changelog for this version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c "
          import os, re
          version = os.environ['TAG_NAME'].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pattern = rf'## \[{re.escape(version)}\].*?\n(.*?)(?=\n## |\Z)'
          m = re.search(pattern, text, re.DOTALL)
          body = m.group(1).strip() if m else 'See CHANGELOG.md for details.'
          open('release_body.md', 'w', encoding='utf-8').write(body)
          "

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --notes-file release_body.md \
            --generate-notes
